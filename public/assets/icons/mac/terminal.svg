<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="tShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="tBaseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c2c2e"/>
      <stop offset="100%" stop-color="#141416"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1e"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="promptGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34c759"/>
      <stop offset="100%" stop-color="#30d158"/>
    </linearGradient>
  </defs>

  <!-- Outer Squircle with Shadow -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#tBaseGrad)" filter="url(#tShadow)"/>
  <!-- Highlight stroke -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Inner Display Screen -->
  <rect x="7" y="7" width="50" height="50" rx="11" fill="url(#screenGrad)"/>

  <!-- Top Title Bar Line -->
  <line x1="7" y1="18" x2="57" y2="18" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Window Traffic Lights -->
  <circle cx="13" cy="13" r="2.2" fill="#ff453a"/>
  <circle cx="19" cy="13" r="2.2" fill="#ff9f0a"/>
  <circle cx="25" cy="13" r="2.2" fill="#30d158"/>

  <!-- Terminal Command Prompt (>_) -->
  <!-- Chevron > -->
  <path d="M 15 28 L 26 36 L 15 44" fill="none" stroke="url(#promptGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Blinking Cursor _ -->
  <line x1="30" y1="44" x2="45" y2="44" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
</svg>
