<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eaebef"/>
    </linearGradient>
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d6d7dc"/>
      <stop offset="100%" stop-color="#f8f9fa"/>
    </linearGradient>
    <linearGradient id="pdfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff453a"/>
      <stop offset="100%" stop-color="#d70015"/>
    </linearGradient>
  </defs>

  <!-- Page Body with Shadow -->
  <g filter="url(#shadow)">
    <!-- Main page path with cut top-right corner -->
    <path d="M 14 6 C 11.79 6 10 7.79 10 10 L 10 54 C 10 56.21 11.79 58 14 58 L 50 58 C 52.21 58 54 56.21 54 54 L 54 20 L 40 6 Z" fill="url(#pageGrad)"/>
    <!-- Folded corner -->
    <path d="M 40 6 L 54 20 L 42 20 C 40.89 20 40 19.11 40 18 Z" fill="url(#foldGrad)"/>
    <path d="M 40 6 L 54 20 L 40 20 Z" fill="#000000" opacity="0.08"/>
  </g>

  <!-- Text Preview Lines -->
  <rect x="18" y="16" width="16" height="2.5" rx="1.25" fill="#a0a4ab" opacity="0.8"/>
  <rect x="18" y="22" width="28" height="2" rx="1" fill="#c4c7cc" opacity="0.8"/>
  <rect x="18" y="27" width="24" height="2" rx="1" fill="#c4c7cc" opacity="0.8"/>
  <rect x="18" y="32" width="28" height="2" rx="1" fill="#c4c7cc" opacity="0.8"/>

  <!-- PDF Badge (macOS style) -->
  <g filter="url(#shadow)">
    <rect x="14" y="38" width="36" height="15" rx="3.5" fill="url(#pdfGrad)"/>
    <text x="32" y="49.5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">PDF</text>
  </g>
</svg>
