<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="cShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="cBaseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#735f52"/>
      <stop offset="100%" stop-color="#46362c"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0efe9"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a84ff"/>
      <stop offset="100%" stop-color="#0066cc"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base with drop shadow -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#cBaseGrad)" filter="url(#cShadow)"/>

  <!-- Left Spine Detail -->
  <rect x="4" y="4" width="7" height="56" rx="4" fill="#32241b" opacity="0.6"/>

  <!-- Inner Card -->
  <rect x="13" y="8" width="41" height="48" rx="6" fill="url(#cardGrad)"/>

  <!-- Address Book Tabs on the Right -->
  <path d="M 50 12 L 53 12 C 54.1 12 55 12.9 55 14 L 55 19 C 55 20.1 54.1 21 53 21 L 50 21 Z" fill="#ff453a"/>
  <path d="M 50 23 L 53 23 C 54.1 23 55 23.9 55 25 L 55 30 C 55 31.1 54.1 32 53 32 L 50 32 Z" fill="#ff9f0a"/>
  <path d="M 50 34 L 53 34 C 54.1 34 55 34.9 55 36 L 55 41 C 55 42.1 54.1 43 53 43 L 50 43 Z" fill="#30d158"/>
  <path d="M 50 45 L 53 45 C 54.1 45 55 45.9 55 47 L 55 51 C 55 52.1 54.1 53 53 53 L 50 53 Z" fill="#0a84ff"/>

  <!-- User Avatar Silhouette -->
  <!-- Head -->
  <circle cx="31.5" cy="24" r="6.5" fill="url(#avatarGrad)"/>
  <!-- Torso / Shoulders -->
  <path d="M 19.5 44 C 19.5 37.5 25 34 31.5 34 C 38 34 43.5 37.5 43.5 44 C 43.5 45 42.5 46 41 46 L 22 46 C 20.5 46 19.5 45 19.5 44 Z" fill="url(#avatarGrad)"/>
</svg>
